<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01iverx · 独立开发者</title>
  <meta name="description" content="01iverx — 独立开发者，专注于 C++、Python 与 AI-Infra。" />
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121722;
      --surface-hover: #171d2b;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --green: #3fb950;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-hover: #f3f4f6;
      --border: rgba(27, 31, 36, 0.1);
      --border-strong: rgba(27, 31, 36, 0.18);
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, 0.1);
      --green: #1a7f37;
      --shadow: 0 16px 40px rgba(31, 35, 40, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 20px;
      transition: background-color 0.25s ease, color 0.25s ease;
      background-image: radial-gradient(
        circle at 50% 0%,
        var(--accent-soft) 0%,
        transparent 55%
      );
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .prompt-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.16);
    }

    .theme-toggle {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }

    .theme-toggle:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: var(--surface-hover);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: var(--shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #7ee787);
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0b0e14;
      flex-shrink: 0;
      user-select: none;
    }

    .hero-text h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .role {
      margin-top: 4px;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 500;
    }

    .intro {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .section-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .skill-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .skill-item:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    .skill-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .skill-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (max-width: 640px) {
      .card {
        padding: 26px 20px;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <div class="prompt-tag">
        <span class="status-dot" aria-hidden="true"></span>
        <span>~/01iverx</span>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
        切换浅色
      </button>
    </div>

    <section class="card">
      <header class="hero">
        <div class="avatar" aria-hidden="true">01</div>
        <div class="hero-text">
          <h1>01iverx</h1>
          <p class="role">独立开发者 · Indie Developer</p>
        </div>
      </header>

      <p class="intro">
        你好，我是 <strong>01iverx</strong>，一名独立开发者。长期关注高性能系统工程与人工智能基础设施，喜欢用简洁可靠的代码构建高效工具与底层系统。
      </p>

      <div>
        <h2 class="section-title">专业技能 / Skills</h2>
        <div class="skills-grid">
          <article class="skill-item">
            <h3 class="skill-name">C++</h3>
            <p class="skill-desc">高性能系统开发、内存管理与并发性能优化。</p>
          </article>
          <article class="skill-item">
            <h3 class="skill-name">Python</h3>
            <p class="skill-desc">工程自动化、后端服务与 AI 生态工具链开发。</p>
          </article>
          <article class="skill-item">
            <h3 class="skill-name">AI-Infra</h3>
            <p class="skill-desc">模型推理部署、分布式计算与底层算力基础设施。</p>
          </article>
        </div>
      </div>
    </section>

    <footer>
      <span>© 2026 01iverx · Hosted on GitHub Pages</span>
    </footer>
  </main>

  <script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light" || savedTheme === "dark") {
      root.setAttribute("data-theme", savedTheme);
      toggleBtn.textContent = savedTheme === "dark" ? "切换浅色" : "切换深色";
    }

    toggleBtn.addEventListener("click", () => {
      const current = root.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      toggleBtn.textContent = next === "dark" ? "切换浅色" : "切换深色";
    });
  </script>
</body>
</html>
