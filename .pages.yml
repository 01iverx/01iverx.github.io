media:
  input: public/images
  output: /images

content:
  - name: blog_zh
    label: 博客（中文）
    type: collection
    path: src/content/blog/zh
    view:
      fields: [title, date, draft]
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text

  - name: blog_en
    label: Blog (English)
    type: collection
    path: src/content/blog/en
    view:
      fields: [title, date, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text

  - name: readme
    label: 英文简介 (README.md)
    type: file
    path: README.md
    fields:
      - name: body
        label: 内容
        type: code
        options:
          language: markdown

  - name: readme_cn
    label: 中文简介 (README_cn.md)
    type: file
    path: README_cn.md
    fields:
      - name: body
        label: 内容
        type: code
        options:
          language: markdown
